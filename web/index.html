<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>BetterStomp</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="mark.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="mark.png" alt=""><span>BetterStomp</span></div>
  <nav class="nav" id="nav">
    <a href="#/profilo" data-p="profilo">Profilo</a>
    <a href="#/campioni" data-p="campioni">Campioni</a>
    <a href="#/tier" data-p="tier">Tier list</a>
    <a href="#/select" data-p="select">Champion Select</a>
    <a href="#/patch" data-p="patch">Patch</a>
    <a href="#/overlay" data-p="overlay">Overlay</a>
    <a href="#/streaming" data-p="streaming">Streaming</a>
    <a href="#/impostazioni" data-p="impostazioni">Impostazioni</a>
  </nav>
  <span class="gamechip" title="Altri giochi in arrivo">League of Legends</span>
  <div class="status"><span class="dot" id="cdot"></span><span id="ctext">Client non connesso</span></div>
  <button class="iconbtn" id="themebtn" title="Tema chiaro / scuro">☀</button>
  <div class="winbtns"><button data-win="min" title="Riduci a icona"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button><button data-win="max" title="Ingrandisci"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1.5"/></svg></button><button data-win="close" class="cl" title="Chiudi"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
</header>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="rz"><i data-rz="1" class="l"></i><i data-rz="2" class="r"></i><i data-rz="3" class="t"></i><i data-rz="6" class="b"></i><i data-rz="4" class="tl"></i><i data-rz="5" class="tr"></i><i data-rz="7" class="bl"></i><i data-rz="8" class="br"></i></div>
<script src="app.js"></script>
</body>
</html>
